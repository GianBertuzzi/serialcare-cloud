AWSTemplateFormatVersion: "2010-09-09"
Description: SerialCare Cloud Eval 4 infrastructure with a public ALB, one private modular Docker host and private RDS PostgreSQL.

Parameters:
  DBName:
    Type: String
    Description: PostgreSQL database name.
    Default: serialcare_db
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{1,62}$"

  DBUsername:
    Type: String
    Description: PostgreSQL admin username.
    Default: serialcare_user
    MinLength: 1
    MaxLength: 63
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,62}$"

  DBPassword:
    Type: String
    Description: PostgreSQL admin password. Avoid characters that need URL encoding.
    NoEcho: true
    MinLength: 8
    MaxLength: 64
    AllowedPattern: "^[A-Za-z0-9_+=,.-]+$"

  InstanceType:
    Type: String
    Description: EC2 instance type for private app nodes.
    Default: t3.micro
    AllowedValues:
      - t2.micro
      - t3.micro
      - t3.small
      - t3.medium

  VpcCidr:
    Type: String
    Default: 10.30.0.0/16
    Description: CIDR block for the VPC.

  PublicSubnet1Cidr:
    Type: String
    Default: 10.30.1.0/24
    Description: CIDR block for public subnet 1.

  PublicSubnet2Cidr:
    Type: String
    Default: 10.30.2.0/24
    Description: CIDR block for public subnet 2.

  PrivateSubnet1Cidr:
    Type: String
    Default: 10.30.11.0/24
    Description: CIDR block for private application and database subnet 1.

  PrivateSubnet2Cidr:
    Type: String
    Default: 10.30.12.0/24
    Description: CIDR block for private application and database subnet 2.

  GitHubRepoUrl:
    Type: String
    Description: HTTPS URL of the SerialCare Cloud GitHub repository.

  RepositoryRef:
    Type: String
    Description: Git branch deployed by the private application host.
    Default: evaluacion-4-devsecops
    AllowedPattern: "^[A-Za-z0-9._/-]+$"

  BootstrapAdminName:
    Type: String
    Description: Display name for the initial ADMIN created only on an empty database.
    Default: Administrador SerialCare
    MinLength: 1
    MaxLength: 120

  BootstrapAdminEmail:
    Type: String
    Description: Email for the initial ADMIN created only on an empty database.
    Default: admin@serialcare.cl
    AllowedPattern: "^[^@ ]+@[^@ ]+[.][^@ ]+$"

  BootstrapAdminPassword:
    Type: String
    Description: Password hashed by the one-shot initializer for the initial ADMIN.
    NoEcho: true
    MinLength: 8
    MaxLength: 72

  JwtSecret:
    Type: String
    Description: JWT secret used by the backend.
    NoEcho: true
    MinLength: 16
    AllowedPattern: "^[A-Za-z0-9_+=,.:;@%/-]+$"

  AzureStorageConnectionString:
    Type: String
    Description: Azure Blob Storage connection string for evidence uploads.
    NoEcho: true
    Default: ""

  AzureStorageContainer:
    Type: String
    Description: Azure Blob container name for evidences.
    Default: evidencias

  AzureStoragePublicBaseUrl:
    Type: String
    Description: Public Azure Blob base URL, for example https://account.blob.core.windows.net.
    Default: ""

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: Latest Amazon Linux 2023 AMI from SSM Parameter Store.
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  SerialCareVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: serialcare-vpc

  SerialCareInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: serialcare-igw

  SerialCareVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref SerialCareVpc
      InternetGatewayId: !Ref SerialCareInternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SerialCareVpc
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: serialcare-public-subnet-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SerialCareVpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: serialcare-public-subnet-2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SerialCareVpc
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: serialcare-private-subnet-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SerialCareVpc
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: serialcare-private-subnet-2

  NatGatewayElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: SerialCareVpcGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: serialcare-nat-eip

  SerialCareNatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayElasticIp.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: serialcare-nat-gateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SerialCareVpc
      Tags:
        - Key: Name
          Value: serialcare-public-rt

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: SerialCareVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref SerialCareInternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SerialCareVpc
      Tags:
        - Key: Name
          Value: serialcare-private-rt

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref SerialCareNatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow public HTTP traffic to the Application Load Balancer.
      VpcId: !Ref SerialCareVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress: []
      Tags:
        - Key: Name
          Value: serialcare-alb-sg

  # Runtime access to Azure Blob and bootstrap registries requires HTTPS to dynamic external endpoints.
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow web traffic only from the Application Load Balancer.
      VpcId: !Ref SerialCareVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          #trivy:ignore:AVD-AWS-0104
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: serialcare-app-sg

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL only from app EC2 instances.
      VpcId: !Ref SerialCareVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
      SecurityGroupEgress: []
      Tags:
        - Key: Name
          Value: serialcare-rds-sg

  LoadBalancerToAppEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LoadBalancerSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      DestinationSecurityGroupId: !Ref AppSecurityGroup

  AppToDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref RdsSecurityGroup

  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for SerialCare RDS PostgreSQL.
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: serialcare-rds-subnet-group

  SerialCareDB:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${AWS::StackName}-postgres"
      DBName: !Ref DBName
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref RdsSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: serialcare-rds-postgres

  ImdsV2LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: Name
              Value: serialcare-imdsv2-required

  AppInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - PrivateDefaultRoute
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      LaunchTemplate:
        LaunchTemplateId: !Ref ImdsV2LaunchTemplate
        Version: !GetAtt ImdsV2LaunchTemplate.LatestVersionNumber
      SubnetId: !Ref PrivateSubnet1
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: serialcare-eval4-app
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee -a /var/log/serialcare-bootstrap.log) 2>&1

          COMPOSE_VERSION=v2.29.7
          INSTALL_DIR=/opt/serialcare-cloud
          ENV_FILE=/etc/serialcare/serialcare.env
          OVERRIDE_FILE=/etc/serialcare/docker-compose.aws.yml

          dnf install -y docker git
          systemctl enable --now docker
          install -d -m 0755 /usr/local/lib/docker/cli-plugins /etc/serialcare

          if ! docker compose version >/dev/null 2>&1; then
            curl -fsSLo /tmp/docker-compose "https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-linux-x86_64"
            curl -fsSLo /tmp/docker-compose-checksums.txt "https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/checksums.txt"
            EXPECTED_SHA="$(awk '/docker-compose-linux-x86_64$/ {print $1}' /tmp/docker-compose-checksums.txt)"
            ACTUAL_SHA="$(sha256sum /tmp/docker-compose | awk '{print $1}')"
            test -n "$EXPECTED_SHA"
            test "$EXPECTED_SHA" = "$ACTUAL_SHA"
            install -m 0755 /tmp/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose
            rm -f /tmp/docker-compose /tmp/docker-compose-checksums.txt
          fi

          if [ -d "$INSTALL_DIR/.git" ]; then
            test -z "$(git -C "$INSTALL_DIR" status --porcelain)"
            git -C "$INSTALL_DIR" fetch --prune origin
            git -C "$INSTALL_DIR" checkout "${RepositoryRef}"
            git -C "$INSTALL_DIR" merge --ff-only "origin/${RepositoryRef}"
          elif [ -e "$INSTALL_DIR" ]; then
            echo "ERROR: $INSTALL_DIR existe y no es un repositorio Git." >&2
            exit 1
          else
            git clone --branch "${RepositoryRef}" --single-branch "${GitHubRepoUrl}" "$INSTALL_DIR"
          fi

          umask 077
          cat > "$ENV_FILE" <<'ENVEOF'
          NODE_ENV=production
          POSTGRES_DB=${DBName}
          POSTGRES_USER=${DBUsername}
          POSTGRES_PASSWORD=${DBPassword}
          DATABASE_URL=postgresql://${DBUsername}:${DBPassword}@${SerialCareDB.Endpoint.Address}:5432/${DBName}?sslmode=no-verify
          BOOTSTRAP_ADMIN_NAME=${BootstrapAdminName}
          BOOTSTRAP_ADMIN_EMAIL=${BootstrapAdminEmail}
          BOOTSTRAP_ADMIN_PASSWORD=${BootstrapAdminPassword}
          BOOTSTRAP_ADMIN_PASSWORD_HASH=
          JWT_SECRET=${JwtSecret}
          FRONTEND_URL=http://${SerialCareLoadBalancer.DNSName}
          AZURE_STORAGE_CONNECTION_STRING=${AzureStorageConnectionString}
          AZURE_BLOB_CONTAINER=${AzureStorageContainer}
          AZURE_STORAGE_CONTAINER=${AzureStorageContainer}
          AZURE_STORAGE_PUBLIC_BASE_URL=${AzureStoragePublicBaseUrl}
          ENVEOF
          chmod 0600 "$ENV_FILE"

          cat > "$OVERRIDE_FILE" <<'COMPOSEEOF'
          services:
            postgres:
              profiles: ["local-database"]
              ports: !reset []
            migrate:
              environment:
                DATABASE_URL: ${!DATABASE_URL}
              depends_on: !reset {}
            clientes-maquinas:
              environment:
                DATABASE_URL: ${!DATABASE_URL}
              depends_on: !override
                migrate:
                  condition: service_completed_successfully
              ports: !reset []
            recepcion-cotizaciones:
              environment:
                DATABASE_URL: ${!DATABASE_URL}
              depends_on: !override
                migrate:
                  condition: service_completed_successfully
              ports: !reset []
            diagnostico-garantias:
              environment:
                DATABASE_URL: ${!DATABASE_URL}
              depends_on: !override
                migrate:
                  condition: service_completed_successfully
              ports: !reset []
            inventario-documentos:
              environment:
                DATABASE_URL: ${!DATABASE_URL}
              depends_on: !override
                migrate:
                  condition: service_completed_successfully
              ports: !reset []
            frontend-gateway:
              ports: !override
                - "80:8080"
          COMPOSEEOF
          chmod 0644 "$OVERRIDE_FILE"

          cd "$INSTALL_DIR"
          COMPOSE=(docker compose --env-file "$ENV_FILE" -f docker-compose.eval4.yml -f "$OVERRIDE_FILE")
          "${!COMPOSE[@]}" config --quiet
          "${!COMPOSE[@]}" build
          "${!COMPOSE[@]}" up -d

          MIGRATE_ID="$("${!COMPOSE[@]}" ps -aq migrate)"
          test -n "$MIGRATE_ID"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$MIGRATE_ID")" = "0"

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done

          "${!COMPOSE[@]}" ps --all
          echo "ERROR: el gateway no alcanzo estado saludable." >&2
          exit 1

  # AWS Academy demonstration requires a public entry point and does not provide private client connectivity.
  #trivy:ignore:AVD-AWS-0053
  SerialCareLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: serialcare-alb
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: serialcare-alb

  SerialCareTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: serialcare-tg
      VpcId: !Ref SerialCareVpc
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /health
      Matcher:
        HttpCode: "200"
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      Targets:
        - Id: !Ref AppInstance
          Port: 80
      Tags:
        - Key: Name
          Value: serialcare-target-group

  # No domain or ACM certificate is available in the AWS Academy lab; HTTP is limited to the academic demo.
  #trivy:ignore:AVD-AWS-0054
  SerialCareHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref SerialCareLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref SerialCareTargetGroup

Outputs:
  LoadBalancerDnsName:
    Description: Public DNS name of the Application Load Balancer.
    Value: !GetAtt SerialCareLoadBalancer.DNSName

  LoadBalancerUrl:
    Description: Public HTTP URL for SerialCare Cloud.
    Value: !Sub "http://${SerialCareLoadBalancer.DNSName}"

  HealthCheckUrl:
    Description: Public gateway health check URL through the ALB.
    Value: !Sub "http://${SerialCareLoadBalancer.DNSName}/health"

  AppPrivateIp:
    Description: Private IP address of the modular application host.
    Value: !GetAtt AppInstance.PrivateIp

  AppInstanceId:
    Description: EC2 instance ID of the private modular application host.
    Value: !Ref AppInstance

  RdsEndpointAddress:
    Description: RDS PostgreSQL endpoint address.
    Value: !GetAtt SerialCareDB.Endpoint.Address

  RdsEndpointPort:
    Description: RDS PostgreSQL endpoint port.
    Value: !GetAtt SerialCareDB.Endpoint.Port

  VpcId:
    Description: VPC ID.
    Value: !Ref SerialCareVpc

  LoadBalancerSecurityGroupId:
    Description: Security Group ID for ALB.
    Value: !Ref LoadBalancerSecurityGroup

  AppSecurityGroupId:
    Description: Security Group ID for app EC2 instances.
    Value: !Ref AppSecurityGroup

  RdsSecurityGroupId:
    Description: Security Group ID for RDS PostgreSQL.
    Value: !Ref RdsSecurityGroup
