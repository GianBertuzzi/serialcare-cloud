upstream clientes_maquinas_backend {
  server clientes-maquinas:3001;
  keepalive 16;
}

upstream recepcion_cotizaciones_backend {
  server recepcion-cotizaciones:3002;
  keepalive 16;
}

upstream diagnostico_garantias_backend {
  server diagnostico-garantias:3003;
  keepalive 16;
}

upstream inventario_documentos_backend {
  server inventario-documentos:3004;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 15m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  proxy_http_version 1.1;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header Content-Type $http_content_type;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_connect_timeout 10s;
  proxy_send_timeout 180s;
  proxy_read_timeout 180s;
  proxy_request_buffering off;

  location ~ ^/api/(?:clientes|productos|modelos|precios-sucursal|tipos-maquina)(?:/|$) {
    proxy_pass http://clientes_maquinas_backend;
  }

  location ~ ^/api/ordenes/[0-9]+/(?:detalle|cotizacion|entregar)/?$ {
    proxy_pass http://recepcion_cotizaciones_backend;
  }

  location ~ ^/api/ordenes/[0-9]+/cotizaciones/[0-9]+/(?:descuento|generar-pdf|pdf|respuesta)/?$ {
    proxy_pass http://recepcion_cotizaciones_backend;
  }

  location ~ ^/api/(?:auth|recepcionistas)(?:/|$) {
    proxy_pass http://recepcion_cotizaciones_backend;
  }

  location ~ ^/api/ordenes/?$ {
    proxy_pass http://recepcion_cotizaciones_backend;
  }

  location ~ ^/api/ordenes/[0-9]+/(?:tomar|diagnostico|decision-garantia|mano-obra|finalizar-borrador|reabrir-cotizacion|finalizar-reparacion|estado|solicitar-garantia)/?$ {
    proxy_pass http://diagnostico_garantias_backend;
  }

  location ~ ^/api/(?:garantias|tipos-reparacion|tecnicos)(?:/|$) {
    proxy_pass http://diagnostico_garantias_backend;
  }

  location ~ ^/api/ordenes/[0-9]+/(?:repuestos(?:/[0-9]+)?|evidencias)/?$ {
    proxy_pass http://inventario_documentos_backend;
  }

  location ~ ^/api/repuestos(?:/|$) {
    proxy_pass http://inventario_documentos_backend;
  }

  location = /api {
    default_type application/json;
    return 404 '{"error":"Ruta no encontrada"}';
  }

  location /api/ {
    default_type application/json;
    return 404 '{"error":"Ruta no encontrada"}';
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
